    own_window_argb_value = 0,
    own_window_transparent = false,
    double_buffer = true,
    background = false,
    border_inner_margin = 0,       -- si no, conky agranda la ventana 10 px
    border_outer_margin = 0,       -- y la tarjeta queda descentrada

