--[[  ventura-xfce · ficha de gráficos (GPU integrada + dedicada)
      Segunda tarjeta, flotando justo debajo del monitor principal.
      Comparte paleta y helpers con conky/ventura.lua.
--]]

local HOME = os.getenv('HOME')

-- La posición se deriva de la tarjeta principal para que el hueco entre
-- ambas sea siempre el mismo aunque se cambie su altura:
local MAIN_GAP_Y = 28    -- gap_y de ventura.conf
local MAIN_H     = 480   -- minimum_height de ventura.conf
local PAD        = 14    -- margen interno para la sombra (ventura.lua)
local GAP        = 14    -- aire visible entre las dos tarjetas

conky.config = {
    alignment = 'top_right',
    gap_x = 8,
    gap_y = MAIN_GAP_Y + MAIN_H - 2 * PAD + GAP,
    minimum_width = 330,  maximum_width = 330,
    minimum_height = 226,
    own_window = true,
    own_window_class = 'Conky',
    own_window_title = 'ventura-gpu',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = false,
    double_buffer = true,
    background = false,
    border_inner_margin = 0,
    border_outer_margin = 0,

    update_interval = 2.0,          -- los datos de GPU cambian más despacio
    no_buffers = true,
    short_units = true,
    format_human_readable = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'Noto Sans:size=9',
    override_utf8_locale = true,

    lua_load = HOME .. '/.config/conky/ventura/ventura.lua',
    lua_draw_hook_post = 'ventura_gpu_draw',
}

conky.text = [[]]
